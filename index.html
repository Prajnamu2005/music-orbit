<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSIC-ORBIT</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color: #D2D2D2;
            background-image:
            repeating-linear-gradient(
                to right, transparent 0 100px,
                #25283b22 100px 101px
            ),
            repeating-linear-gradient(
                to bottom, transparent 0 100px,
                #25283b22 100px 101px
            );
        }
        body::before{
            position: absolute;
            width: min(1400px, 90vw);
            top: 10%;
            left: 50%;
            height: 90vh;
            transform: translateX(-50%);
            content: '';
            background-image: url(bg.png);
            background-size: 100%;
            background-repeat: no-repeat;
            background-position: top center;
            pointer-events: none;
            z-index: 0;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="mode-toggle" id="modeToggle">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
    </div>

    <div class="search-overlay" id="searchOverlay">
        <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="searchInput" placeholder="Search songs, artists..." autocomplete="off">
            <button class="search-close" id="searchClose">&times;</button>
        </div>
    </div>

    <nav class="side-nav" id="sideNav">
        <button class="side-nav-item" id="sideNavSearch">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <span class="side-nav-label">Search</span>
        </button>
        <button class="side-nav-item" data-target="top">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span class="side-nav-label">Home</span>
        </button>
        <button class="side-nav-item" data-target="mostPlayed">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></svg>
            <span class="side-nav-label">Library</span>
        </button>
        <button class="side-nav-item" data-target="recommendations">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
            <span class="side-nav-label">Explore</span>
        </button>
        <button class="side-nav-item" data-target="bottom">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
            <span class="side-nav-label">History</span>
        </button>
    </nav>

    <div class="banner">
        <div class="genre-filters" id="genreFilters">
            <button class="genre-btn active" data-genre="top">Top</button>
            <button class="genre-btn" data-genre="pop">Pop</button>
            <button class="genre-btn" data-genre="hip hop">Hip-Hop</button>
            <button class="genre-btn" data-genre="electronic">Electronic</button>
            <button class="genre-btn" data-genre="rock">Rock</button>
            <button class="genre-btn" data-genre="r&b">R&B</button>
            <button class="genre-btn" data-genre="latin">Latin</button>
        </div>
        <div class="slider" id="slider" style="--quantity: 10"></div>
        <div class="content">
            <h1 data-content="MUSIC-ORBIT">
                MUSIC-ORBIT
            </h1>
            <div class="model"></div>
        </div>
    </div>

    <section class="most-played" id="mostPlayed">
        <h2 class="section-title" data-content="MOST PLAYED">MOST PLAYED</h2>
        <div class="mp-grid">
            <div class="mp-list" id="mpList"></div>
            <div class="mp-featured" id="mpFeatured">
                <canvas class="eq-canvas" id="eqCanvas"></canvas>
                <img class="mp-feat-art" id="mpFeatArt" src="" alt="">
                <div class="mp-feat-info">
                    <span class="mp-feat-label">Top Track</span>
                    <div class="mp-feat-title" id="mpFeatTitle"></div>
                    <div class="mp-feat-artist" id="mpFeatArtist"></div>
                </div>
            </div>
        </div>
    </section>

    <section class="recommendations" id="recommendations">
        <h2 class="section-title" data-content="BROWSE & DISCOVER">BROWSE & DISCOVER</h2>
        <div class="rec-shelves" id="recShelves"></div>
    </section>

    <div class="now-playing" id="nowPlaying">
        <canvas class="np-viz-canvas" id="npVizCanvas"></canvas>
        <div class="np-inner">
            <img class="np-art" id="npAlbumArt" src="" alt="">
            <div class="np-info">
                <div class="np-title" id="npTitle">No song selected</div>
                <div class="np-artist" id="npArtist">-</div>
            </div>
            <div class="np-controls">
                <button class="np-play" id="playBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><polygon points="6,4 20,12 6,20" fill="#ffffff"/></svg>
                </button>
            </div>
            <div class="np-progress-wrap">
                <span class="np-time" id="currentTime">0:00</span>
                <div class="np-progress" id="progressBar">
                    <div class="np-progress-fill" id="progressFill"></div>
                </div>
                <span class="np-time" id="totalDuration">0:00</span>
            </div>
            <button class="np-close" id="closeNp">&times;</button>
        </div>
    </div>

    <audio id="audioPlayer" preload="auto"></audio>
    <script src="script.js"></script>
</body>
</html>
